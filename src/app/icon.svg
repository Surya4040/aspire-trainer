  />

  <!-- Apex Arrow -->
  <path
    d="M 68,138 L 100,104 L 132,138 L 118,148 L 100,128 L 82,148 Z"
    fill="#ffffff"
  />

  <!-- Accent Pulse Dot -->
  <circle cx="100" cy="84" r="5" fill="#f43f5e" />
