<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 140" fill="none">
  <defs>
    <linearGradient id="coralGradFull" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb7185" />
      <stop offset="60%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#be123c" />
    </linearGradient>

    <linearGradient id="blueGradFull" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="60%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>

    <filter id="glowFull" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Logo Mark Container (Left, 100x100 within 140 height) -->
  <g transform="translate(16, 20) scale(0.5)">
    <!-- Ambient Backdrop Glow -->
    <circle cx="100" cy="100" r="70" fill="#f43f5e" opacity="0.15" filter="url(#glowFull)" />

    <!-- Left Wing -->
    <path
      d="M 100,28 L 74,28 L 28,172 L 64,172 L 86,108 L 100,64 Z"
      fill="url(#blueGradFull)"
    />

    <!-- Right Wing -->
    <path
      d="M 100,28 L 126,28 L 172,172 L 136,172 L 114,108 L 100,64 Z"
      fill="url(#coralGradFull)"
    />

    <!-- Upward Apex Arrow -->
    <path
      d="M 68,138 L 100,102 L 132,138 L 118,148 L 100,128 L 82,148 Z"
      fill="#ffffff"
      opacity="0.95"
    />

    <!-- Pulse Dot -->
    <circle cx="100" cy="80" r="5" fill="#f43f5e" />
  </g>

  <!-- Brand Typography -->
  <g transform="translate(140, 78)">
    <!-- "Aspire" Wordmark -->
    <text
      x="0"
      y="0"
      font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
      font-size="52"
      font-weight="900"
      letter-spacing="-1.5"
      fill="#ffffff"
    >
      Aspire<tspan fill="#f43f5e">.</tspan>
    </text>

    <!-- Subtitle / Capability Tagline -->
    <text
      x="2"
      y="26"
      font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace"
      font-size="11"
      font-weight="700"
      letter-spacing="3.5"
      fill="#94a3b8"
    >
      TECH STAFFING &amp; DIGITAL
    </text>
  </g>
</svg>
