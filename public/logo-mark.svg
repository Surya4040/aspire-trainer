<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <!-- Coral-Red Vibrant Gradient -->
    <linearGradient id="coralGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb7185" />
      <stop offset="60%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#be123c" />
    </linearGradient>

    <!-- Electric Blue Tech Gradient -->
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="60%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>

    <!-- Subtle Glow Filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Ambient Backdrop Glow -->
  <circle cx="100" cy="100" r="70" fill="#f43f5e" opacity="0.12" filter="url(#softGlow)" />

  <!-- Left Dynamic Wing / Tech Bracket -->
  <path
    d="M 100,28 L 74,28 L 28,172 L 64,172 L 86,108 L 100,64 Z"
    fill="url(#blueGrad)"
  />

  <!-- Right Dynamic Wing / Tech Bracket -->
  <path
    d="M 100,28 L 126,28 L 172,172 L 136,172 L 114,108 L 100,64 Z"
    fill="url(#coralGrad)"
  />

  <!-- Upward Apex Arrow / Crossbar (Growth & Aspiration Symbol) -->
  <path
    d="M 68,138 L 100,102 L 132,138 L 118,148 L 100,128 L 82,148 Z"
    fill="#ffffff"
    opacity="0.95"
  />

  <!-- Core Pulse Accent Dot -->
  <circle cx="100" cy="80" r="5" fill="#f43f5e" />
</svg>
